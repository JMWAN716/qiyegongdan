spring.application.name=qiyegongdan

# H2 文件数据库（持久化到本地文件，兼容内存模式）
spring.datasource.url=jdbc:h2:file:./data/qiyegongdan;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA 配置
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Jackson 全局时间格式
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8

# 文件上传限制
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB

# 应用自定义配置
app.jwt.secret=qiyegongdan-jwt-secret-key-please-change-in-production-0123456789
app.jwt.expiration=86400000
app.upload-dir=./data/uploads
app.seed-admin-username=admin
app.seed-admin-password=admin123

server.port=8080