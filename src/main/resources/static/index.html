<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>企业工单管理系统</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- ===================== 登录页 ===================== -->
<div id="auth-view" class="auth-wrap hidden">
  <div class="auth-card">
    <h1 class="logo">📋 企业工单系统</h1>
    <p class="subtitle">全流程工单管理与协作平台</p>
    <div id="auth-error" class="alert alert-error hidden"></div>
    <form id="login-form" class="form">
      <div class="field">
        <label>用户名</label>
        <input type="text" id="login-username" placeholder="请输入用户名" required>
      </div>
      <div class="field">
        <label>密码</label>
        <input type="password" id="login-password" placeholder="请输入密码" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">登 录</button>
    </form>
    <div class="divider">或</div>
    <button id="show-register" class="btn btn-ghost btn-block">新用户注册</button>
    <div class="demo-hint">
      <span>演示账号</span>
      <code>admin / admin123</code>
    </div>
  </div>
</div>

<!-- 注册表单（弹窗） -->
<div id="register-modal" class="modal-backdrop hidden">
  <div class="modal">
    <div class="modal-head">
      <h3>注册新账号</h3>
      <button class="modal-close" data-close="register-modal">&times;</button>
    </div>
    <form id="register-form" class="form">
      <div class="field">
        <label>用户名</label>
        <input type="text" id="reg-username" required minlength="3">
      </div>
      <div class="field">
        <label>密码</label>
        <input type="password" id="reg-password" required minlength="6">
      </div>
      <div class="field">
        <label>姓名</label>
        <input type="text" id="reg-realname" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">注册并登录</button>
    </form>
  </div>
</div>

<!-- ===================== 主应用 ===================== -->
<div id="app-view" class="hidden">
  <aside class="sidebar" id="sidebar">
    <div class="brand">📋 工单系统</div>
    <nav class="nav">
      <button class="nav-item" data-view="dashboard"><span>📊</span> 数据看板</button>
      <button class="nav-item" data-view="tickets"><span>📝</span> 工单管理</button>
      <button class="nav-item" data-view="create" id="nav-create"><span>➕</span> 创建工单</button>
      <button class="nav-item nav-admin" data-view="users" id="nav-users"><span>👥</span> 用户管理</button>
      <button class="nav-item nav-admin" data-view="logs" id="nav-logs"><span>🛡️</span> 操作日志</button>
    </nav>
    <div class="sidebar-foot">
      <div id="user-info" class="user-info"></div>
      <button id="logout-btn" class="btn btn-ghost btn-block">退出登录</button>
    </div>
  </aside>

  <main class="main">
    <!-- 顶部条 -->
    <header class="topbar">
      <button id="menu-toggle" class="icon-btn">☰</button>
      <h2 id="view-title">数据看板</h2>
      <div class="topbar-right">
        <span id="topbar-role" class="badge"></span>
      </div>
    </header>

    <!-- 各视图容器 -->
    <div id="view-dashboard" class="view"></div>
    <div id="view-tickets" class="view hidden"></div>
    <div id="view-create" class="view hidden"></div>
    <div id="view-users" class="view hidden"></div>
    <div id="view-logs" class="view hidden"></div>
    <!-- 工单详情（全屏抽屉） -->
    <div id="ticket-detail" class="drawer hidden"></div>
  </main>
</div>

<script src="/js/app.js"></script>
</body>
</html>
